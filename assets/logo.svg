<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Where It All Began</title>
  <desc id="desc">A refined gold and black emblem with an open book and the words Where It All Began.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d58a"/>
      <stop offset="0.45" stop-color="#b8862f"/>
      <stop offset="1" stop-color="#f0c75e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="900" height="300" fill="transparent"/>
  <g filter="url(#shadow)">
    <circle cx="450" cy="150" r="137" fill="#151515" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="450" cy="150" r="125" fill="none" stroke="#4a3b24" stroke-width="1" opacity=".8"/>
    <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M385 125 Q420 98 447 124 L450 145 Q420 122 385 145 Z" fill="#24201a" stroke-width="4"/>
      <path d="M515 125 Q480 98 453 124 L450 145 Q480 122 515 145 Z" fill="#24201a" stroke-width="4"/>
      <path d="M382 146 Q417 128 448 149 Q417 140 382 158" stroke-width="4"/>
      <path d="M518 146 Q483 128 452 149 Q483 140 518 158" stroke-width="4"/>
      <path d="M450 145 L450 166" stroke-width="4"/>
    </g>
    <text x="450" y="190" text-anchor="middle" fill="#f7f0df" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="2.2">WHERE IT ALL</text>
    <text x="450" y="226" text-anchor="middle" fill="url(#gold)" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="48" font-style="italic" font-weight="700">Began</text>
    <path d="M385 238 Q450 253 515 238" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>