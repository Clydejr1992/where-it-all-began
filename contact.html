<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <meta name="description"
        content="Contact Where It All Began.">

    <title>
        Contact | Where It All Began
    </title>

    <link rel="stylesheet"
        href="assets/css/styles.css">

</head>


<body>


<header class="site-header">

    <div class="container nav-wrap">


        


        <button
            class="menu-toggle"
            aria-label="Open menu"
            aria-expanded="false">

            ☰

        </button>


        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a href="tell-your-story.html">
                Tell Your Story
            </a>

            <a href="interviews.html">
                Live Interviews
            </a>

            <a href="stories.html">
                Stories
            </a>

            <a href="about.html">
                About
            </a>

            <a class="nav-button active"
                href="contact.html">

                Contact

            </a>

        </nav>


    </div>

</header>



<main>


<section class="page-hero">

    <div class="container narrow">


        <p class="eyebrow">
            GET IN TOUCH
        </p>


        <h1>
            Contact
        </h1>


        <p>
            Have a question, an idea, or interest
            in an interview? Send a message.
        </p>


    </div>

</section>



<section class="section">


    <div class="container narrow">


        <form
            id="contactForm"
            class="contact-form">


            <label>

                Name

                <input
                    name="name"
                    required>

            </label>


            <label>

                Email

                <input
                    name="email"
                    type="email"
                    required>

            </label>


            <label>

                What can we help with?


                <select name="topic">

                    <option>
                        General question
                    </option>

                    <option>
                        Tell my story
                    </option>

                    <option>
                        Live interview
                    </option>

                    <option>
                        Partnership
                    </option>

                </select>

            </label>


            <label>

                Message

                <textarea
                    name="message"
                    rows="8"
                    required></textarea>

            </label>


            <button
                class="button"
                type="submit">

                Prepare Email

            </button>


            <p
                id="contactStatus"
                class="status">

            </p>


        </form>



        <div class="note">

            <strong>
                Current setup:
            </strong>

            This form prepares an email in your
            mail app. A server-side contact system
            can be connected later.

        </div>


    </div>

</section>


</main>



<footer class="footer">


    <div class="container copyright">

        © <span data-year></span>
        Where It All Began.

    </div>


</footer>



<script src="assets/js/site.js"></script>

<script src="assets/js/contact.js"></script>


</body>

</html>
