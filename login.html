<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Where It All Began</title>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a href="index.html" class="site-logo">
            Where It All Began
        </a>

        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="tell-your-story.html">Tell Your Story</a>
            <a href="stories.html">Stories</a>
        </nav>

    </div>
</header>


<main>

<section class="page-hero">
    <div class="container">

        <p class="eyebrow">Your story belongs here</p>

        <h1>Sign In</h1>

        <p>
            Create an account or sign in to save your stories securely.
        </p>

    </div>
</section>


<section class="section">

    <div class="container narrow">

        <form id="authForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Your password"
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="button"
                    id="signInBtn"
                >
                    Sign In
                </button>

                <button
                    type="button"
                    class="button button-light"
                    id="signUpBtn"
                >
                    Create Account
                </button>

            </div>


            <p
                id="authStatus"
                class="form-help"
                aria-live="polite"
            ></p>

        </form>

    </div>

</section>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 Where It All Began
        </p>

        <p>
            <a href="privacy.html">Privacy</a>
            &nbsp; | &nbsp;
            <a href="terms.html">Terms</a>
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/auth.js"></script>

</body>
</html>
